services:
  mysql:
    image: mysql:8.4
    container_name: traingo-mysql
    # Vietnam time, matching serverTimezone in the JDBC URL. Without it the
    # server runs in UTC, and CURRENT_DATE in the seed migration is a day behind
    # between midnight and 7 am.
    command: ["--default-time-zone=+07:00"]
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: traingo
      MYSQL_USER: traingo
      MYSQL_PASSWORD: traingo
    # Host port 3007, not 3306: a MySQL installed on the dev machine often
    # already listens on 3306, and the container then fails to start.
    ports:
      - "3007:3306"
    volumes:
      - traingo-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-utraingo", "-ptraingo"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  traingo-mysql-data:
