<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<body>

<!--
	The four steps of a booking. A page includes it with the step it shows, 1 to 4:

		<nav th:replace="~{fragments/booking-steps :: steps(3)}"></nav>

	A passed step links back to its page. Steps 1 and 2 depend on the booking
	in progress, so their addresses come from the model when the page has them:

		stepsTripsUrl  step 1, the trip list with the search the user ran,
		               e.g. /trips?from=HNI&to=HUE&date=2026-10-24
		stepsSeatsUrl  step 2, the seat page of the trip being booked
-->
<nav th:fragment="steps(current)" class="stepper" aria-label="Các bước đặt vé"
	th:with="hrefs=${ {stepsTripsUrl != null ? stepsTripsUrl : '/trips',
			stepsSeatsUrl != null ? stepsSeatsUrl : '#',
			'/booking/passengers'} },
		names=${ {'Chọn chuyến', 'Chọn chỗ', 'Xác nhận', 'Thanh toán'} }">
	<ol>
		<li th:each="name, it : ${names}"
			th:with="step=${it.count}"
			th:classappend="${step < current} ? 'is-done'"
			th:attr="aria-current=${step == current} ? 'step' : null">
			<a th:if="${step < current}" th:href="@{${hrefs[it.index]}}">
				<span class="step-dot"><i class="bi bi-check-lg" aria-hidden="true"></i></span>
				<span class="step-label" th:text="${name}">Chọn chuyến</span>
				<span class="visually-hidden">, đã xong</span>
			</a>
			<th:block th:unless="${step < current}">
				<span class="step-dot" th:text="${step}">2</span>
				<span class="step-label" th:text="${name}">Chọn chỗ</span>
			</th:block>
		</li>
	</ol>
	<p class="stepper-now" aria-hidden="true" th:text="|Bước ${current} trên 4: ${names[current - 1]}|">Bước 2 trên 4: Chọn chỗ</p>
</nav>

<!-- One leg: the two times and stations with the duration between them. -->
<div th:fragment="leg(departure, arrival, plusDays, origin, destination, duration)" class="trip-times">
	<div class="trip-time"><b th:text="${#temporals.format(departure, 'HH:mm')}">08:00</b><small th:text="${origin}">Huế</small></div>
	<div class="trip-dur" th:text="${duration}">1 giờ 45 phút</div>
	<div class="trip-time to"><b><th:block th:text="${#temporals.format(arrival, 'HH:mm')}">09:45</th:block><sup th:if="${plusDays > 0}" th:text="|+${plusDays}|">+1</sup></b><small th:text="${destination}">Đà Nẵng</small></div>
</div>

</body>
</html>
