<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<body>

<!--
	The e-ticket of issue #34, shared by the success page, /tickets/{id} and
	/my-trips/{id}/tickets, with an "Đã hủy" badge when the booking was cancelled:

		<li th:replace="~{fragments/ticket-card :: card(${ticket}, ${index}, ${count})}"></li>

	index and count (1 and 3 for "Vé 1/3") may be null; the card then shows no
	"Vé i/N" badge.
-->
<li class="ticket is-issued" th:fragment="card(ticket, index, count)" th:classappend="${ticket.cancelled} ? 'is-void'">
	<article class="ticket-main">
		<div class="ticket-head">
			<span class="brand"><img class="brand-mark" th:src="@{/images/brand/logo.svg}" width="40" height="40" alt="">TrainGo</span>
			<span class="badge badge-muted" th:if="${index != null and !ticket.cancelled}" th:text="|Vé ${index}/${count}|">Vé 1/2</span>
			<span class="badge badge-muted" th:if="${ticket.cancelled}">Đã hủy</span>
		</div>
		<div th:replace="~{fragments/booking-steps :: leg(${ticket.departureAt}, ${ticket.arrivalAt}, ${ticket.arrivesNextDay}, ${ticket.originName}, ${ticket.destinationName}, ${ticket.durationLabel})}"></div>
		<dl>
			<div><dt>Người đi</dt><dd th:text="${ticket.passengerName}">Nguyễn Văn An</dd></div>
			<div><dt>CCCD</dt><dd th:text="${ticket.maskedId}">•••• 1234</dd></div>
			<div><dt>Giá vé</dt><dd th:text="${#numbers.formatInteger(ticket.price, 0, 'POINT')} + ' đ'">100.000 đ</dd></div>
			<div><dt>Tàu</dt><dd th:text="${ticket.trainCode}">SE1</dd></div>
			<div><dt>Ngày khởi hành</dt><dd th:text="${#temporals.format(ticket.departureAt, 'dd/MM/yyyy')}">31/10/2026</dd></div>
			<div><dt>Mã booking</dt><dd class="ticket-code" th:text="${ticket.bookingCode}">BK202610001</dd></div>
		</dl>
	</article>
	<div class="ticket-stub">
		<div><small th:text="|Toa ${ticket.coachNumber}, ${#strings.toLowerCase(ticket.coachTypeLabel)}|">Toa 1, ghế ngồi</small><b th:text="${ticket.seatCode}">A05</b></div>
		<div><small>Mã vé</small><div class="ticket-code" th:text="${ticket.ticketCode}">TK202610001-01</div></div>
	</div>
</li>

</body>
</html>
