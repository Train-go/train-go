<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<body>

<!--
	Fragment names are not "footer": a selector that matches a tag name pulls
	in every <footer> of this file, so both footers would render.
-->
<footer th:fragment="fullFooter" class="site-footer">
	<div class="footer-photo" aria-hidden="true"><img th:src="@{/images/home/footer-duong-ray.jpg}" width="2000" height="1126" alt="" loading="lazy"></div>
	<div class="container">
		<div class="footer-cols">
			<div class="footer-brand">
				<a class="brand" th:href="@{/}" aria-label="TrainGo, trang chủ"><img class="brand-mark" th:src="@{/images/brand/logo.svg}" width="40" height="40" alt="">TrainGo</a>
				<p class="footer-note">Đặt vé tàu trực tuyến, chọn chỗ trên sơ đồ toa.</p>
				<a class="btn btn-primary btn-sm" th:href="@{/#search}"><i class="bi bi-search" aria-hidden="true"></i>Tìm chuyến</a>
			</div>
			<nav aria-labelledby="f-book">
				<h2 id="f-book">Đặt vé</h2>
				<ul>
					<li><a th:href="@{/trips}">Chọn chuyến</a></li>
					<li><a th:href="@{/my-trips}">Vé của tôi</a></li>
				</ul>
			</nav>
			<nav aria-labelledby="f-routes">
				<h2 id="f-routes">Hành trình nổi bật</h2>
				<ul id="footer-routes">
					<li th:each="route : ${popular.footerRoutes}">
						<a class="footer-route" th:href="@{/trips(from=${route.originCode}, to=${route.destinationCode})}">
							<img class="footer-thumb" th:if="${route.photo != null}" th:src="@{${route.photo.path}}" width="56" height="40" alt="" loading="lazy">
							<span><th:block th:text="${route.originPlace}">Hà Nội</th:block> <i class="bi bi-arrow-right" aria-hidden="true"></i><span class="visually-hidden">đến</span> <th:block th:text="${route.destinationPlace}">Sài Gòn</th:block></span>
						</a>
					</li>
					<li><a class="footer-more" th:href="@{/#routes-title}">Xem thêm <i class="bi bi-arrow-right" aria-hidden="true"></i></a></li>
				</ul>
			</nav>
			<nav aria-labelledby="f-acc" th:if="${currentUser == null}">
				<h2 id="f-acc">Tài khoản</h2>
				<ul>
					<li><a th:href="@{/login}">Đăng nhập</a></li>
					<li><a th:href="@{/register}">Đăng ký</a></li>
				</ul>
			</nav>
		</div>
		<div class="footer-legal">
			<span>© 2026 TrainGo</span>
		</div>
	</div>
</footer>

<!-- One line for the booking steps, the account pages and the error pages. -->
<footer th:fragment="compactFooter" class="footer-legal-compact">
	<div class="container">
		<span>© 2026 TrainGo</span>
		<a th:href="@{/}">Trang chủ</a>
	</div>
</footer>

</body>
</html>
