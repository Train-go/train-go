<!DOCTYPE html>
<!--
	One e-ticket (issue #34), /tickets/{id}. The card is the shared fragment
	fragments/ticket-card; this page adds the way back to the booking.
-->
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
	th:replace="~{layout/base :: page(title=~{::title}, styles=~{::link}, content=~{::main}, compactFooter=true)}">
<head>
	<title th:text="|Vé ${ticket.ticketCode} · TrainGo|">Vé TK202610001-01 · TrainGo</title>
	<link rel="stylesheet" th:href="@{/css/pages/tickets.css}">
</head>
<body>

<main class="page">
<div class="container tickets">
	<h1>Vé điện tử</h1>
	<ol class="ticket-list">
		<li th:replace="~{fragments/ticket-card :: card(${ticket}, null, null)}"></li>
	</ol>
	<div class="ticket-after">
		<a th:href="@{/my-trips/{id}/tickets(id=${ticket.bookingId})}"><i class="bi bi-ticket-perforated" aria-hidden="true"></i>Các vé của booking</a>
		<a th:href="@{/my-trips/{id}(id=${ticket.bookingId})}"><i class="bi bi-chevron-left" aria-hidden="true"></i>Chi tiết booking</a>
	</div>
</div>
</main>

</body>
</html>
