<!DOCTYPE html>
<!--
	Every ticket of one booking (issue #34), /my-trips/{id}/tickets, in code
	order (-01, -02 ...). Each card opens its own page through a link on it.
-->
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
	th:replace="~{layout/base :: page(title=~{::title}, styles=~{::link}, content=~{::main}, compactFooter=true)}">
<head>
	<title th:text="|Vé của booking ${bookingCode} · TrainGo|">Vé của booking BK202610001 · TrainGo</title>
	<link rel="stylesheet" th:href="@{/css/pages/tickets.css}">
</head>
<body>

<main class="page">
<div class="container tickets">
	<h1 th:text="|Vé của booking ${bookingCode}|">Vé của booking BK202610001</h1>
	<ol class="ticket-list">
		<th:block th:each="ticket, it : ${tickets}">
			<li th:replace="~{fragments/ticket-card :: card(${ticket}, ${it.count}, ${it.size})}"></li>
			<li class="ticket-entry">
				<a class="ticket-open" th:href="@{/tickets/{id}(id=${ticket.id})}">Mở vé <th:block th:text="${ticket.ticketCode}">TK202610001-01</th:block> <i class="bi bi-arrow-right" aria-hidden="true"></i></a>
			</li>
		</th:block>
	</ol>
	<div class="ticket-after">
		<a th:href="@{/my-trips/{id}(id=${bookingId})}"><i class="bi bi-chevron-left" aria-hidden="true"></i>Chi tiết booking</a>
	</div>
</div>
</main>

</body>
</html>
