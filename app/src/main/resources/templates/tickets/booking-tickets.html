<!DOCTYPE html>
<!--
	Every ticket of one booking (issue #34), /my-trips/{id}/tickets, in code
	order (-01, -02 ...). Each card opens its own page through a link on it.
-->
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
	th:replace="~{layout/base :: page(title=~{::title}, content=~{::main}, compactFooter=true)}">
<head>
	<title th:text="|Vé của booking ${bookingCode} · TrainGo|">Vé của booking BK202610001 · TrainGo</title>
</head>
<body>

<main class="container tg-pass">
	<div class="tg-pass-col">
		<h1 class="tg-pass-title" th:text="|Vé của booking ${bookingCode}|">Vé của booking BK202610001</h1>

		<div class="tg-pass-stack">
			<div class="tg-tk-entry" th:each="ticket, it : ${tickets}">
				<div th:replace="~{fragments/ticket-card :: card(${ticket}, ${it.count}, ${it.size})}"></div>
				<a class="tg-tk-open" th:href="@{/tickets/{id}(id=${ticket.id})}">
					Mở vé <span class="tg-mono" th:text="${ticket.ticketCode}">TK202610001-01</span>
					<i class="bi bi-arrow-right" aria-hidden="true"></i>
				</a>
			</div>
		</div>

		<div class="tg-pay-after">
			<a th:href="@{/my-trips/{id}(id=${bookingId})}"><i class="bi bi-arrow-left" aria-hidden="true"></i>Chi tiết booking</a>
		</div>
	</div>
</main>

</body>
</html>
