<!DOCTYPE html>
<!--
	PageExceptionHandler renders this when a trip cannot be booked: it does not
	exist, was cancelled or has already left. Built on the customer shell with
	the one-line footer, like the other error pages.
-->
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
	th:replace="~{layout/base :: page(title=~{::title}, styles=~{::link}, content=~{::main}, compactFooter=true)}">
<head>
	<title>Không đặt được chuyến này · TrainGo</title>
	<link rel="stylesheet" th:href="@{/css/pages/error.css}">
</head>
<body>
<main class="error-page container">
	<section class="card state">
		<span class="state-code">Không đặt được</span>
		<h1>Chuyến này không còn để đặt</h1>
		<p th:text="${reason} ?: 'Chuyến này hiện không đặt được.'">Chuyến này đã bị hủy.</p>
		<a class="btn btn-primary" th:href="@{/trips}">Chọn chuyến khác</a>
	</section>
</main>
</body>
</html>
