<!DOCTYPE html>
<!--
	Spring Boot renders this when Spring Security refuses a signed-in user,
	or a form arrives without its CSRF token.
	Built on the customer shell with the one-line footer.
-->
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
	th:replace="~{layout/base :: page(title=~{::title}, styles=~{::link}, content=~{::main}, compactFooter=true)}">
<head>
	<title>Không có quyền truy cập · TrainGo</title>
	<link rel="stylesheet" th:href="@{/css/pages/error.css}">
</head>
<body>
<main class="error-page container">
	<section class="card state">
		<span class="state-code">Lỗi 403</span>
		<h1>Bạn không có quyền xem trang này</h1>
		<p>Trang này dành cho tài khoản khác.</p>
		<a class="btn btn-primary" th:href="@{/}">Về trang chủ</a>
			<!-- Signing out first, so the login page asks for the other account. -->
			<form th:action="@{/logout}" method="post">
				<button type="submit" class="btn btn-outline btn-lg">Đăng nhập bằng tài khoản khác</button>
			</form>
	</section>
</main>
</body>
</html>
