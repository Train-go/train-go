<!DOCTYPE html>
<!--
	Spring Boot renders this when Spring Security refuses a signed-in user,
	or a form arrives without its CSRF token.
	Built on the customer shell with the one-line footer.
-->
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
	th:replace="~{layout/base :: page(title=~{::title}, content=~{::main}, compactFooter=true)}">
<head>
	<title>Không có quyền truy cập · TrainGo</title>
</head>
<body>
<main class="container">
	<section class="tg-error">
		<span class="tg-error-code">Lỗi 403</span>
		<h1>Bạn không có quyền xem trang này</h1>
		<p>Trang này dành cho tài khoản khác.</p>
		<div class="tg-error-actions">
			<a class="btn btn-primary btn-lg" th:href="@{/}">Về trang chủ</a>
			<!-- Signing out first, so the login page asks for the other account. -->
			<form th:action="@{/logout}" method="post">
				<button type="submit" class="btn btn-outline-primary btn-lg">Đăng nhập bằng tài khoản khác</button>
			</form>
		</div>
	</section>
</main>
</body>
</html>
