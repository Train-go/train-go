<!DOCTYPE html>
<!--
	Any 4xx status without its own page (400, 405...). Spring Boot picks
	error/<status>.html first, then error/4xx.html.
	Built on the customer shell with the one-line footer.
-->
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
	th:replace="~{layout/base :: page(title=~{::title}, styles=~{::link}, content=~{::main}, compactFooter=true)}">
<head>
	<title>Có lỗi xảy ra · TrainGo</title>
	<link rel="stylesheet" th:href="@{/css/pages/error.css}">
</head>
<body>
<main class="error-page container">
	<section class="card state">
		<span class="state-code" th:if="${status != null}" th:text="|Lỗi ${status}|">Lỗi 400</span>
		<h1>Có lỗi xảy ra</h1>
		<p>Yêu cầu của bạn chưa được xử lý. Vui lòng quay lại trang chủ và thử lại.</p>
		<a class="btn btn-primary" th:href="@{/}">Về trang chủ</a>
	</section>
</main>
</body>
</html>
