<!DOCTYPE html>
<!--
	Any 4xx status without its own page (400, 405...). Spring Boot picks
	error/<status>.html first, then error/4xx.html.
	Built on the customer shell with the one-line footer.
-->
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
	th:replace="~{layout/base :: page(title=~{::title}, content=~{::main}, compactFooter=true)}">
<head>
	<title>Có lỗi xảy ra · TrainGo</title>
</head>
<body>
<main class="container">
	<section class="tg-error">
		<span class="tg-error-code" th:if="${status != null}" th:text="|Lỗi ${status}|">Lỗi 400</span>
		<h1>Có lỗi xảy ra</h1>
		<p>Yêu cầu của bạn chưa được xử lý. Vui lòng quay lại trang chủ và thử lại.</p>
		<div class="tg-error-actions">
			<a class="btn btn-primary btn-lg" th:href="@{/}">Về trang chủ</a>
		</div>
	</section>
</main>
</body>
</html>
