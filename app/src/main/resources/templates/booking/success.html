<!DOCTYPE html>
<!--
	The page after a paid booking (issue #33). It reads the booking the same
	way "Vé của tôi" does, so another customer's booking id is the 404 page.
	"Xem các vé" opens the e-tickets of the booking (#34).
-->
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
	th:replace="~{layout/base :: page(title=~{::title}, styles=~{::link}, content=~{::main}, compactFooter=true)}">
<head>
	<title>Đặt vé thành công · TrainGo</title>
	<link rel="stylesheet" th:href="@{/css/pages/success.css}">
</head>
<body>

<main class="page">
<div class="container done">
	<section class="done-head" aria-labelledby="done-title">
		<h1 id="done-title">Đặt vé thành công</h1>
		<div class="done-meta">
			<dl class="trip-facts">
				<div><dt>Mã booking</dt><dd class="ticket-code" th:text="${booking.code}">BK202610001</dd></div>
				<div><dt>Tổng tiền</dt><dd th:text="${#numbers.formatInteger(booking.totalPrice, 0, 'POINT')} + ' đ'">200.000 đ</dd></div>
			</dl>
			<span class="badge badge-success"><i class="bi bi-check-lg" aria-hidden="true"></i><th:block th:text="${booking.statusLabel}">Đã thanh toán</th:block></span>
		</div>
	</section>
	<ol class="ticket-list">
		<th:block th:each="ticket, it : ${tickets}">
			<li th:replace="~{fragments/ticket-card :: card(${ticket}, ${it.count}, ${it.size})}"></li>
		</th:block>
	</ol>
	<div class="done-actions">
		<a class="btn btn-primary" th:href="@{/trips}">Đặt chuyến khác</a>
		<a class="btn btn-outline" th:href="@{/my-trips}"><i class="bi bi-ticket-perforated" aria-hidden="true"></i>Vé của tôi</a>
		<button class="btn btn-outline" type="button" onclick="window.print()"><i class="bi bi-printer" aria-hidden="true"></i>In vé</button>
	</div>
</div>
</main>

</body>
</html>
