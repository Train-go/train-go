<!DOCTYPE html>
<!--
	Step 3 of a booking, the passenger page (issue #32), after
	docs/reports/ui-mau/client/hanh-khach-2-the-ve.html: one ticket per chosen
	seat, each with the passenger's name and CCCD.

	The name defaults to the account holder's, whose masked phone then shows on
	the ticket. "Đổi người đi" opens the name field (passengers.js); the CCCD is
	always asked. The form only changes the session draft (D7). Names and CCCD
	are checked on the server, so the page works the same when a check fails.
-->
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
	th:replace="~{layout/base :: page(title=~{::title}, content=~{::main}, compactFooter=true)}">
<head>
	<title>Vé của bạn · TrainGo</title>
</head>
<body>

<main class="container tg-pass">

	<nav th:replace="~{fragments/booking-steps :: steps(3)}"></nav>

	<div class="tg-pass-col">
		<h1 class="tg-pass-title">Vé của bạn</h1>

		<div class="alert alert-danger d-flex gap-2" role="alert" th:if="${errorMessage}">
			<i class="bi bi-exclamation-triangle-fill" aria-hidden="true"></i>
			<span th:text="${errorMessage}">Số hành khách phải bằng số chỗ đã chọn.</span>
		</div>

		<form method="post" id="tgPassForm" th:action="@{/booking/passengers}" th:object="${form}" novalidate
			th:data-account-name="${page.accountName}">

			<div class="tg-pass-stack">
				<div class="tg-tkw" th:each="slot, it : ${page.slots}"
					th:with="line=${form.passengers[it.index]},
						mine=${form.passengers[it.index].fullName == page.accountName},
						nameField=|passengers[${it.index}].fullName|,
						idField=|passengers[${it.index}].identityNumber|,
						editing=${form.passengers[it.index].fullName != page.accountName or #fields.hasErrors('passengers[' + it.index + '].fullName')}">

					<article class="tg-tk" data-ticket>
						<div class="tg-tk-main">
							<div class="tg-tk-top">
								<span class="tg-tk-brand"><i class="bi bi-train-front" aria-hidden="true"></i>
									<th:block th:text="|TrainGo · ${page.trip.trainCode} · ${#temporals.format(page.trip.departureAt, 'dd/MM/yyyy')}|">TrainGo · SE1 · 28/10/2026</th:block></span>
								<span class="tg-tk-no" th:text="|Vé ${slot.number}/${page.slots.size()}|">Vé 1/2</span>
							</div>

							<div class="tg-tk-leg">
								<div>
									<b th:text="${#temporals.format(page.trip.departureAt, 'HH:mm')}">06:15</b>
									<small th:text="${page.trip.originName}">Huế</small>
								</div>
								<div class="tg-tk-rail">
									<i class="bi bi-train-front" aria-hidden="true"></i>
									<span th:text="${page.trip.durationLabel}">2g45</span>
								</div>
								<div class="tg-tk-end">
									<b><th:block th:text="${#temporals.format(page.trip.arrivalAt, 'HH:mm')}">08:00</th:block><sup
										th:if="${page.trip.arrivesNextDay > 0}" th:text="|+${page.trip.arrivesNextDay}|">+1</sup></b>
									<small th:text="${page.trip.destinationName}">Đà Nẵng</small>
								</div>
							</div>

							<div class="tg-tk-who">
								<div class="tg-tk-person">
									<span class="tg-tk-avatar" th:classappend="${mine} ? '' : 'is-other'" data-avatar
										th:text="${T(com.voyagego.traingo.common.TextUtils).initials(line.fullName)}">VA</span>
									<div>
										<b data-person th:text="${line.fullName} ?: '—'">Nguyễn Văn An</b>
										<small data-phone th:if="${page.maskedPhone != null}" th:hidden="${!mine}"
											th:text="|SĐT ${page.maskedPhone}|">SĐT •••• 4567</small>
									</div>
								</div>
								<button class="tg-tk-link" type="button" data-edit th:aria-expanded="${editing}">
									<i class="bi bi-pencil" aria-hidden="true"></i>Đổi người đi
								</button>
							</div>

							<div class="tg-tk-edit" data-edit-box th:hidden="${!editing}">
								<label class="tg-field" th:classappend="${#fields.hasErrors(nameField)} ? 'is-bad'">
									<span>Họ và tên người đi</span>
									<input type="text" autocomplete="off" maxlength="100" data-name
										th:field="*{__${nameField}__}">
									<small class="tg-field-msg" th:if="${#fields.hasErrors(nameField)}"
										th:errors="*{__${nameField}__}">Nhập họ tên người đi.</small>
								</label>
								<button class="tg-tk-link" type="button" data-mine>
									<i class="bi bi-person-check" aria-hidden="true"></i>Dùng tên tài khoản
								</button>
							</div>

							<label class="tg-field" th:classappend="${#fields.hasErrors(idField)} ? 'is-bad'">
								<span>Số CCCD</span>
								<input type="text" inputmode="numeric" autocomplete="off" maxlength="12"
									placeholder="12 chữ số" data-identity th:field="*{__${idField}__}">
								<small class="tg-field-msg" th:if="${#fields.hasErrors(idField)}"
									th:errors="*{__${idField}__}">Số CCCD gồm đúng 12 chữ số.</small>
							</label>
						</div>

						<div class="tg-tk-stub">
							<span class="tg-tk-coach" th:text="|Toa ${slot.coachNumber}|">Toa 1</span>
							<span class="tg-tk-big" th:text="${slot.seatCode}">A05</span>
							<span class="tg-tk-kind" th:text="${slot.typeLabel}">Ghế ngồi</span>
							<span class="tg-tk-price" th:text="${#numbers.formatInteger(slot.price, 0, 'POINT')} + 'đ'">170.000đ</span>
							<span class="tg-tk-bars" aria-hidden="true"></span>
						</div>
					</article>
				</div>
			</div>

			<div class="tg-pass-bar">
				<div class="tg-pass-bar-in">
					<span>
						<small th:text="|${page.slots.size()} vé · Tổng tiền|">2 vé · Tổng tiền</small>
						<strong th:text="${#numbers.formatInteger(page.total, 0, 'POINT')} + 'đ'">340.000đ</strong>
					</span>
					<button class="tg-pass-next" type="submit">Tiếp tục <i class="bi bi-arrow-right" aria-hidden="true"></i></button>
				</div>
			</div>

			<!-- Saves what was typed, then opens the seat page of this trip. -->
			<button class="tg-pass-back" type="submit" formnovalidate th:formaction="@{/booking/passengers/reselect}">
				<i class="bi bi-arrow-left" aria-hidden="true"></i>Chọn lại chỗ
			</button>
		</form>
	</div>

	<script th:src="@{/js/passengers.js}"></script>
</main>

</body>
</html>
