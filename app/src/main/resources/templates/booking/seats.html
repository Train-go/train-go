<!DOCTYPE html>
<!--
	Step 2 of a booking, the seat page (issue #30), after
	docs/reports/ui-mau/client/dat-ve-e2-tau-ngang-tom-tat.html.

	The trip header and summary come from the server. The train strip, the
	coach map and the chosen-seat list are drawn by seat-map.js from
	GET /api/trips/{id}/seat-map. "Tiếp tục" posts the chosen seat ids, which
	the script copies into hidden inputs; nothing is locked until payment.
-->
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
	th:replace="~{layout/base :: page(title=~{::title}, styles=~{::link}, content=~{::main}, compactFooter=true)}">
<head>
	<title th:text="|Chọn chỗ ${trip.originName} → ${trip.destinationName} · TrainGo|">Chọn chỗ · TrainGo</title>
	<link rel="stylesheet" th:href="@{/css/pages/seats.css}">
</head>
<body>

<main class="page" id="tgSeats"
	th:data-api-url="@{/api/trips/{id}/seat-map(id=${trip.tripId})}"
	th:data-type="${coachType}"
	th:data-selected="${#strings.listJoin(selectedSeatIds, ',')}"
	data-max="10">
<div class="container">

	<nav th:replace="~{fragments/booking-steps :: steps(2)}"></nav>

	<div class="alert alert-danger" role="alert" th:if="${errorMessage}">
		<i class="bi bi-exclamation-triangle" aria-hidden="true"></i><span th:text="${errorMessage}">Chỗ A05 vừa được người khác đặt. Vui lòng chọn chỗ khác.</span>
	</div>

	<section class="card trip-summary" aria-labelledby="trip-title">
		<div>
			<h1 id="trip-title"><th:block th:text="${#strings.replace(trip.originName, 'Ga ', '')}">Huế</th:block> <i class="bi bi-arrow-right" aria-hidden="true"></i><span class="visually-hidden">đến</span> <th:block th:text="${#strings.replace(trip.destinationName, 'Ga ', '')}">Đà Nẵng</th:block></h1>
			<dl class="trip-facts">
				<div><dt><i class="bi bi-train-front" aria-hidden="true"></i>Tàu</dt><dd th:text="${trip.trainCode}">SE1</dd></div>
				<div><dt><i class="bi bi-calendar3" aria-hidden="true"></i>Ngày khởi hành</dt><dd th:text="${dayLabel}">Thứ tư, 28/10</dd></div>
				<div><dt><i class="bi bi-clock" aria-hidden="true"></i>Giờ</dt><dd><th:block th:text="|${#temporals.format(trip.departureAt, 'HH:mm')} đến ${#temporals.format(trip.arrivalAt, 'HH:mm')}|">08:00 đến 09:45</th:block><sup th:if="${trip.arrivesNextDay > 0}" th:text="|+${trip.arrivesNextDay}|">+1</sup></dd></div>
				<div><dt><i class="bi bi-ticket-perforated" aria-hidden="true"></i>Giá vé</dt><dd id="tgPrice"></dd></div>
			</dl>
		</div>
		<a class="btn btn-outline btn-sm" th:href="@{${stepsTripsUrl}}">Đổi chuyến</a>
	</section>

	<div class="book">
		<section aria-label="Sơ đồ chỗ">
			<div class="consist" role="group" th:attr="aria-label=|Đoàn tàu ${trip.trainCode}|">
				<div class="loco" aria-hidden="true"><span class="loco-glass"></span><small>Đầu tàu</small></div>
				<div class="consist-cars" role="tablist" aria-label="Chọn toa" id="tgTrain"></div>
			</div>
			<div class="card coach" role="tabpanel" id="coach-panel">
				<div class="coach-head">
					<h2 id="tgCoachTitle">Toa</h2>
					<ul class="legend" aria-label="Chú thích">
						<li><span class="swatch"></span>Còn trống</li>
						<li><span class="swatch is-picked"><i class="bi bi-check-lg" aria-hidden="true"></i></span>Bạn chọn</li>
						<li><span class="swatch is-booked"><i class="bi bi-x-lg" aria-hidden="true"></i></span>Đã đặt</li>
					</ul>
				</div>
				<div id="tgCoachMap" aria-live="polite">
					<p class="seats-loading">Đang tải sơ đồ chỗ...</p>
				</div>
			</div>
		</section>

		<aside class="card summary" aria-labelledby="sum-title">
			<h2 id="sum-title">Chỗ đã chọn</h2>
			<ul class="picks" id="tgPicked" aria-label="Chỗ đã chọn"></ul>
			<div class="picks-empty" id="tgPickedEmpty"><i class="bi bi-grid-3x2-gap" aria-hidden="true"></i>Chưa chọn chỗ nào</div>
			<div class="total"><span id="tgCount">0 vé</span><b id="tgTotal">0 đ</b></div>
			<button class="btn btn-cta btn-block" id="tgNext" type="submit" form="tgSeatForm" disabled>Tiếp tục</button>
			<p class="notice" role="status" id="tgNotice"></p>
		</aside>
	</div>

	<form method="post" id="tgSeatForm" th:action="@{/booking/{id}/seats(id=${trip.tripId})}">
		<input type="hidden" name="type" th:value="${coachType}" th:if="${coachType != null}">
	</form>
</div>
	<script th:src="@{/js/seat-map.js}"></script>
</main>

</body>
</html>
