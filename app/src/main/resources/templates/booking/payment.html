<!DOCTYPE html>
<!--
	Step 4 of a booking, the payment page (issue #33), after
	docs/reports/ui-mau/client/thanh-toan.html: the bill as a paper receipt
	with serrated top and bottom edges. The button posts to /booking/payment,
	which books the seats and creates the booking and tickets in one
	transaction. payment.js only locks the button once pressed.
-->
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
	th:replace="~{layout/base :: page(title=~{::title}, styles=~{::link}, content=~{::main}, compactFooter=true)}">
<head>
	<title>Thanh toán · TrainGo</title>
	<link rel="stylesheet" th:href="@{/css/pages/payment.css}">
</head>
<body>

<main class="page">
<div class="container">

	<nav th:replace="~{fragments/booking-steps :: steps(4)}"></nav>

	<section class="card invoice" aria-labelledby="invoice-title">
		<div class="invoice-head">
			<h1 id="invoice-title">Hóa đơn</h1>
			<a class="btn btn-outline btn-sm" th:href="@{${stepsSeatsUrl}}">Đổi chỗ</a>
		</div>
		<div th:replace="~{fragments/booking-steps :: leg(${invoice.trip.departureAt}, ${invoice.trip.arrivalAt}, ${invoice.trip.arrivesNextDay}, ${#strings.replace(invoice.trip.originName, 'Ga ', '')}, ${#strings.replace(invoice.trip.destinationName, 'Ga ', '')}, ${invoice.trip.durationLabel})}"></div>
		<dl class="trip-facts">
			<div><dt><i class="bi bi-train-front" aria-hidden="true"></i>Tàu</dt><dd th:text="${invoice.trip.trainCode}">SE1</dd></div>
			<div><dt><i class="bi bi-calendar3" aria-hidden="true"></i>Ngày khởi hành</dt><dd th:text="${dayLabel}">Thứ bảy, 31/10/2026</dd></div>
		</dl>
		<table class="lines">
			<caption class="visually-hidden">Các vé trong hóa đơn</caption>
			<thead><tr><th scope="col">Chỗ</th><th scope="col">Người đi</th><th scope="col" class="num">Giá</th></tr></thead>
			<tbody>
				<tr th:each="line : ${invoice.lines}">
					<td><span class="seat-tag" th:text="${line.seatCode}">A05</span><small th:text="|${line.typeLabel}, toa ${line.coachNumber}|">Ghế ngồi, toa 1</small></td>
					<td th:text="${line.passengerName}">Nguyễn Văn An</td>
					<td class="num" th:text="${#numbers.formatInteger(line.price, 0, 'POINT')} + ' đ'">100.000 đ</td>
				</tr>
			</tbody>
			<tfoot><tr><th scope="row" colspan="2">Tổng tiền</th><td class="num" th:text="${#numbers.formatInteger(invoice.total, 0, 'POINT')} + ' đ'">200.000 đ</td></tr></tfoot>
		</table>
		<form class="pay" method="post" id="tgPayForm" th:action="@{/booking/payment}">
			<button class="btn btn-cta btn-block btn-lg" type="submit" id="tgPayButton" th:text="|Thanh toán ${#numbers.formatInteger(invoice.total, 0, 'POINT')} đ|">Thanh toán 200.000 đ</button>
			<p class="pay-note"><i class="bi bi-info-circle" aria-hidden="true"></i>Hủy được trước giờ tàu chạy, không mất phí.</p>
		</form>
	</section>
</div>
	<script th:src="@{/js/payment.js}"></script>
</main>

</body>
</html>
