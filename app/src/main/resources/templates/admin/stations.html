<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
	th:replace="~{admin/layout/base :: page(~{::title}, ~{::main})}">
<head>
	<title>Ga · Quản trị TrainGo</title>
</head>
<body>
<main>

	<div class="page-head">
		<h1>Ga</h1>
		<span class="count" th:text="|${#lists.size(stations)} ga|">8 ga</span>
		<span class="grow"></span>
		<a class="btn btn-primary" th:href="@{/admin/stations/new}">
			<i class="bi bi-plus-lg" aria-hidden="true"></i>Thêm ga
		</a>
	</div>

	<div class="panel table-responsive">
		<table class="table table-hover align-middle">
			<thead>
				<tr>
					<th scope="col" class="num shrink">Lý trình</th>
					<th scope="col" class="shrink">Mã ga</th>
					<th scope="col">Tên ga</th>
					<th scope="col">Tỉnh / Thành phố</th>
					<th scope="col">Địa chỉ</th>
					<th scope="col"><span class="visually-hidden">Thao tác</span></th>
				</tr>
			</thead>
			<tbody>
				<tr th:each="station : ${stations}">
					<td class="num text-nowrap" th:text="|Km ${station.kmMark}|">Km 1726</td>
					<td><span class="code" th:text="${station.code}">SGN</span></td>
					<td class="fw-bold" th:text="${station.name}">Ga Sài Gòn</td>
					<td th:text="${station.city}">TP. Hồ Chí Minh</td>
					<td th:text="${station.address}">1 Nguyễn Thông</td>
					<td class="actions">
						<a class="icon-btn" th:href="@{/admin/stations/{id}/edit(id=${station.id})}"
							th:title="|Sửa ${station.name}|" th:aria-label="|Sửa ${station.name}|">
							<i class="bi bi-pencil" aria-hidden="true"></i>
						</a>
						<!--
							A form rather than a link: deleting must be a POST, and a
							form carries the CSRF token Spring Security checks.
							admin.js asks the data-confirm question before it submits.
						-->
						<form method="post"
							th:action="@{/admin/stations/{id}/delete(id=${station.id})}"
							th:data-confirm="|Xóa ${station.name} (${station.code})?|"
							data-confirm-body="Không hoàn tác được. Ga đang là điểm đi hoặc điểm đến của một tuyến sẽ không xóa được."
							data-confirm-label="Xóa ga" data-confirm-danger>
							<button type="submit" class="icon-btn danger"
								th:title="|Xóa ${station.name}|" th:aria-label="|Xóa ${station.name}|">
								<i class="bi bi-trash" aria-hidden="true"></i>
							</button>
						</form>
					</td>
				</tr>
			</tbody>
		</table>
	</div>

</main>
</body>
</html>
