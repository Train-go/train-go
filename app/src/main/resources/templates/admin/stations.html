<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
	th:replace="~{admin/layout/base :: page(~{::title}, ~{::link}, ~{::main})}">
<head>
	<title>Ga và tuyến · Quản trị TrainGo</title>
	<link rel="stylesheet" th:href="@{/css/admin/pages/stations.css}">
</head>
<body>
<main class="admin-wrap" id="station-network">
	<div class="page-head">
		<h1>Ga và tuyến</h1>
		<div class="page-actions" id="net-actions" hidden>
			<button type="button" class="btn btn-outline-secondary" data-add-station><i class="bi bi-plus-lg" aria-hidden="true"></i>Thêm ga</button>
			<a class="btn btn-primary" th:href="@{/admin/routes/new}"><i class="bi bi-plus-lg" aria-hidden="true"></i>Thêm tuyến</a>
		</div>
	</div>
	<noscript><p class="alert alert-secondary">Vui lòng bật JavaScript để xem và quản lý ga và tuyến.</p></noscript>
	<div id="net-load-error" class="alert alert-danger" role="alert" hidden>
		<span></span><button type="button" class="btn btn-outline-danger">Thử lại</button>
	</div>
	<div class="net" hidden>
		<section class="dc-card net-line" aria-labelledby="line-h">
			<div class="panel-head"><h2 id="line-h">Đường tàu Bắc – Nam</h2></div>
			<div data-line></div>
		</section>
		<section class="dc-card net-routes" aria-labelledby="routes-h">
			<div class="panel-head">
				<h2 id="routes-h">Tuyến</h2>
				<div class="search net-search">
					<i class="bi bi-search" aria-hidden="true"></i>
					<input type="search" class="form-control" data-route-search placeholder="Tên hoặc mã ga"
						aria-label="Tìm tuyến theo tên hoặc mã ga" autocomplete="off">
				</div>
			</div>
			<div data-routes></div>
		</section>
	</div>
	<!-- A station, a pair of stations or a new station open here (station-panels.js). -->
	<aside class="offcanvas offcanvas-end" id="net-sheet" tabindex="-1" aria-labelledby="net-panel-h">
		<div class="offcanvas-header">
			<span class="grow"></span>
			<button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Đóng"></button>
		</div>
		<div class="offcanvas-body"><section class="net-panel"></section></div>
	</aside>
	<template id="net-station-template">
		<div class="panel-body">
			<div class="panel-title"><h2 id="net-panel-h" tabindex="-1"></h2><span class="code" data-value="code"></span></div>
			<p class="facts"><span>Km <b data-value="kmMark"></b></span><span data-value="city"></span><span data-value="address"></span></p>
			<div class="pane-actions">
				<button type="button" class="btn btn-outline-secondary" data-action="edit-station">Sửa</button>
				<button type="button" class="btn btn-outline-danger" data-action="delete-station">Xóa</button>
			</div>
			<p id="station-delete-reason" class="form-text" hidden></p>
			<div data-fan-host></div>
		</div>
	</template>
	<template id="net-edit-template">
		<form class="panel-body" autocomplete="off" novalidate>
			<h2 id="net-panel-h" tabindex="-1"></h2><div class="d-grid gap-3" data-station-fields></div>
			<div class="pane-actions"><button type="button" class="btn btn-outline-secondary" data-action="cancel">Hủy</button><button type="submit" class="btn btn-primary">Lưu</button></div>
		</form>
	</template>
	<template id="net-gap-template">
		<form class="panel-body" autocomplete="off" novalidate>
			<h2 id="net-panel-h" tabindex="-1"></h2><div class="d-grid gap-3" data-station-fields></div>
			<p id="km-range-warning" class="alert alert-warning" role="status" hidden></p>
			<p data-km-error class="alert alert-danger" role="alert" hidden></p>
			<div class="pane-actions"><button type="button" class="btn btn-outline-secondary" data-action="cancel">Hủy</button><button type="submit" class="btn btn-primary">Lưu ga</button></div>
		</form>
	</template>
	<template id="net-station-fields-template">
		<div><label for="station-name" class="form-label">Tên ga <span class="required-mark" aria-hidden="true">*</span></label>
			<input id="station-name" name="name" class="form-control" maxlength="100" required></div>
		<div><label for="station-code" class="form-label">Mã ga <span class="required-mark" aria-hidden="true">*</span></label>
			<input id="station-code" name="code" class="form-control" maxlength="10" spellcheck="false" autocapitalize="characters" required>
			<p id="station-code-help" class="form-text" hidden>Ga đã có tuyến nên giữ mã.</p></div>
		<div><label for="station-city" class="form-label">Tỉnh / Thành phố</label><input id="station-city" name="city" class="form-control" maxlength="100"></div>
		<div><label for="station-address" class="form-label">Địa chỉ</label><input id="station-address" name="address" class="form-control" maxlength="255"></div>
		<div><label for="station-km" class="form-label">Lý trình (km) <span class="required-mark" aria-hidden="true">*</span></label>
			<input id="station-km" name="kmMark" type="number" class="form-control" min="0" max="5000" step="1" inputmode="numeric" required></div>
	</template>
	<template id="net-suggest-template">
		<div class="panel-body">
			<h2 id="net-panel-h" tabindex="-1"></h2>
			<div data-suggest-host></div>
		</div>
	</template>
	<template id="net-pair-template">
		<div class="panel-body">
			<h2 id="net-panel-h" tabindex="-1"></h2><p class="text-body-secondary" data-pair-distance></p><div class="net-directions"></div>
		</div>
	</template>
	<template id="net-direction-template">
		<form class="net-direction" autocomplete="off" novalidate>
			<h3 data-direction-name></h3><span class="code" data-direction-code></span><p data-direction-meta></p>
			<div data-distance-field><label class="form-label">Khoảng cách (km)</label>
				<input name="distanceKm" type="number" class="form-control" min="1" step="1" inputmode="numeric" required></div>
			<div><button type="submit" class="btn btn-outline-secondary" data-action="create-route">Tạo chiều này</button>
				<a class="btn btn-outline-secondary" data-action="edit-route">Sửa khoảng cách</a>
				<button type="button" class="btn btn-outline-danger" data-action="delete-route">Xóa</button></div>
			<p class="form-text" data-delete-reason hidden></p>
		</form>
	</template>
	<script defer th:src="@{/js/admin/station-gazetteer.js}"></script>
	<script defer th:src="@{/js/admin/station-draft.js}"></script>
	<script defer th:src="@{/js/admin/route-suggestions.js}"></script>
	<script defer th:src="@{/js/admin/fan-out.js}"></script>
	<script defer th:src="@{/js/admin/station-line.js}"></script>
	<script defer th:src="@{/js/admin/station-panels.js}"></script>
	<script defer th:src="@{/js/admin/stations.js}"></script>
</main>
</body>
</html>
