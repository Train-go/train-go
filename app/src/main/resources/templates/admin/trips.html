<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
	th:replace="~{admin/layout/base :: page(~{::title}, ~{::main})}">
<head>
	<title>Chuyến · Quản trị TrainGo</title>
</head>
<body>
<main>

	<div class="page-head">
		<h1>Chuyến</h1>
		<span class="count" th:text="|${#lists.size(trips)} chuyến|">18 chuyến</span>
	</div>

	<div class="panel table-responsive">
		<table class="table table-hover align-middle">
			<thead>
				<tr>
					<th scope="col" class="shrink">Tàu</th>
					<th scope="col">Tuyến</th>
					<th scope="col">Ngày đi</th>
					<th scope="col">Giờ đi</th>
					<th scope="col">Giờ đến</th>
					<th scope="col" class="num">Giá vé</th>
					<th scope="col">Trạng thái</th>
				</tr>
			</thead>
			<tbody>
				<tr th:each="trip : ${trips}">
					<td><span class="code" th:text="${trip.trainCode}">SE1</span></td>
					<td th:text="${trip.route}">Ga Hà Nội - Ga Thanh Hóa</td>
					<td class="text-nowrap" th:text="${trip.departureDate}">01/09/2026</td>
					<td th:text="${trip.departureTime}">08:00</td>
					<td class="text-nowrap" th:text="${trip.arrivalTime}">11:40</td>
					<td class="num text-nowrap" th:text="${#numbers.formatInteger(trip.basePrice, 0, 'POINT')} + 'đ'">250.000đ</td>
					<td>
						<!-- Labels come from AdminService.tripStatusLabel. -->
						<span class="tag"
							th:classappend="${trip.status} == 'Mở bán' ? 'scheduled' : (${trip.status} == 'Đã hủy' ? 'cancelled' : 'done')"
							th:text="${trip.status}">Mở bán</span>
					</td>
				</tr>
			</tbody>
		</table>
	</div>

</main>
</body>
</html>
