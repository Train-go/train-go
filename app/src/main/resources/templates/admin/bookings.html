<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
	th:replace="~{admin/layout/base :: page(~{::title}, ~{::main})}">
<head>
	<title>Booking · Quản trị TrainGo</title>
</head>
<body>
<main>

	<div class="page-head">
		<h1>Booking</h1>
		<span class="count" th:text="|${#lists.size(bookings)} booking|">8 booking</span>
	</div>

	<div class="panel table-responsive">
		<table class="table table-hover align-middle">
			<thead>
				<tr>
					<th scope="col" class="shrink">Mã booking</th>
					<th scope="col">Khách hàng</th>
					<th scope="col">Chuyến</th>
					<th scope="col" class="num">Số vé</th>
					<th scope="col" class="num">Tổng tiền</th>
					<th scope="col">Trạng thái</th>
				</tr>
			</thead>
			<tbody>
				<tr th:each="booking : ${bookings}">
					<td><span class="code" th:text="${booking.code}">TG26080001</span></td>
					<td th:text="${booking.customer}">Nguyễn Văn An</td>
					<td class="text-nowrap" th:text="${booking.trip}">SE1 · 01/09/2026</td>
					<td class="num" th:text="${booking.passengers}">2</td>
					<td class="num text-nowrap" th:text="${#numbers.formatInteger(booking.total, 0, 'POINT')} + 'đ'">500.000đ</td>
					<td>
						<!-- Labels come from AdminService.bookingLabel. -->
						<span class="tag"
							th:classappend="${booking.paymentStatus} == 'Đã thanh toán' ? 'ok'
								: (${booking.paymentStatus} == 'Đã hủy' ? 'cancelled' : 'running')"
							th:text="${booking.paymentStatus}">Đã thanh toán</span>
					</td>
				</tr>
			</tbody>
		</table>
	</div>

</main>
</body>
</html>
