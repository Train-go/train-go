<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
	th:replace="~{admin/layout/base :: page(~{::title}, ~{::main})}">
<head>
	<title>Tuyến · Quản trị TrainGo</title>
</head>
<body>
<main>

	<div class="page-head">
		<h1>Tuyến</h1>
		<span class="count" th:text="|${#lists.size(routes)} tuyến|">16 tuyến</span>
	</div>

	<div class="panel table-responsive">
		<table class="table table-hover align-middle">
			<thead>
				<tr>
					<th scope="col" class="shrink">Mã tuyến</th>
					<th scope="col">Ga đi</th>
					<th scope="col">Ga đến</th>
					<th scope="col" class="num">Khoảng cách</th>
				</tr>
			</thead>
			<tbody>
				<tr th:each="route : ${routes}">
					<td><span class="code" th:text="${route.code}">SGN-NTR</span></td>
					<td th:text="${route.origin}">Ga Sài Gòn</td>
					<td th:text="${route.destination}">Ga Nha Trang</td>
					<td class="num text-nowrap" th:text="|${route.distanceKm} km|">411 km</td>
				</tr>
			</tbody>
		</table>
	</div>

</main>
</body>
</html>
