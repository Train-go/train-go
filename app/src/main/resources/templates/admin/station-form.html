<!DOCTYPE html>
<!--
	One template for adding and editing a station. stationId is only in the
	model when editing, so it decides the heading and where the form posts.
-->
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
	th:replace="~{admin/layout/base :: page(~{::title}, ~{::main})}">
<head>
	<title th:text="${stationId == null} ? 'Thêm ga · Quản trị TrainGo' : 'Sửa ga · Quản trị TrainGo'">Thêm ga · Quản trị TrainGo</title>
</head>
<body>
<main th:with="editing=${stationId != null}">

	<div class="page-head">
		<a class="btn btn-link" th:href="@{/admin/stations}">
			<i class="bi bi-arrow-left" aria-hidden="true"></i>Danh sách ga
		</a>
	</div>

	<div class="panel">
		<!--
			novalidate: every rule is checked on the server, which shows its
			messages in Vietnamese next to the field. The browser's own
			bubbles would come in the browser's language instead.
		-->
		<form class="panel-body" method="post" novalidate th:object="${stationForm}"
			th:action="${editing} ? @{/admin/stations/{id}(id=${stationId})} : @{/admin/stations}">
			<h1 th:text="${editing} ? 'Sửa ga' : 'Thêm ga'">Thêm ga</h1>

			<div class="row g-3">
				<div class="col-md-4">
					<label for="code" class="form-label">Mã ga <span class="required-mark" aria-hidden="true">*</span></label>
					<input type="text" class="form-control" th:field="*{code}" th:errorclass="is-invalid"
						maxlength="10" autocomplete="off" required aria-describedby="codeHelp">
					<div class="invalid-feedback" th:errors="*{code}">Vui lòng nhập mã ga.</div>
					<div id="codeHelp" class="form-text">Chữ cái không dấu và chữ số, tối đa 10 ký tự, ví dụ SGN.</div>
				</div>
				<div class="col-md-5">
					<label for="name" class="form-label">Tên ga <span class="required-mark" aria-hidden="true">*</span></label>
					<input type="text" class="form-control" th:field="*{name}" th:errorclass="is-invalid"
						maxlength="100" required>
					<div class="invalid-feedback" th:errors="*{name}">Vui lòng nhập tên ga.</div>
				</div>
				<div class="col-md-3">
					<label for="kmMark" class="form-label">Lý trình (km) <span class="required-mark" aria-hidden="true">*</span></label>
					<input type="number" class="form-control" th:field="*{kmMark}" th:errorclass="is-invalid"
						min="0" max="5000" step="1" inputmode="numeric" required aria-describedby="kmMarkHelp">
					<div class="invalid-feedback" th:errors="*{kmMark}">Vui lòng nhập lý trình.</div>
					<div id="kmMarkHelp" class="form-text">Số km tính từ ga Hà Nội, ví dụ Huế là 688.</div>
				</div>
				<div class="col-md-4">
					<label for="city" class="form-label">Tỉnh / Thành phố</label>
					<input type="text" class="form-control" th:field="*{city}" th:errorclass="is-invalid"
						maxlength="100">
					<div class="invalid-feedback" th:errors="*{city}">Tỉnh / thành phố quá dài.</div>
				</div>
				<div class="col-md-8">
					<label for="address" class="form-label">Địa chỉ</label>
					<input type="text" class="form-control" th:field="*{address}" th:errorclass="is-invalid"
						maxlength="255">
					<div class="invalid-feedback" th:errors="*{address}">Địa chỉ quá dài.</div>
				</div>
			</div>

			<div class="d-flex flex-wrap gap-2">
				<button type="submit" class="btn btn-primary">
					<i class="bi bi-check-lg" aria-hidden="true"></i><span th:text="${editing} ? 'Lưu thay đổi' : 'Thêm ga'">Thêm ga</span>
				</button>
				<a class="btn btn-outline-secondary" th:href="@{/admin/stations}">Hủy</a>
			</div>
		</form>
	</div>

</main>
</body>
</html>
