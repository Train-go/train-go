<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<body>

<!--
	Admin navigation: a white menu in three groups.

	Active state comes from the activeNav model attribute each controller sets,
	not from the request path, so a nested route such as /admin/trains/7 still
	highlights "Tàu".

	The foot holds the clock (filled by admin.js) and the signed-in user.
-->
<aside th:fragment="sidebar" class="admin-side">
	<a class="brand" th:href="@{/admin}">TrainGo</a>

	<nav class="admin-nav" aria-label="Điều hướng quản trị">
		<div class="grp">
			<a th:href="@{/admin}" th:attr="aria-current=${activeNav == 'overview'} ? 'page' : null">
				<i class="bi bi-speedometer2" aria-hidden="true"></i>Tổng quan
			</a>
		</div>
		<div class="grp">
			<span>Vận hành</span>
			<a th:href="@{/admin/trains}" th:attr="aria-current=${activeNav == 'trains'} ? 'page' : null">
				<i class="bi bi-train-front" aria-hidden="true"></i>Tàu
			</a>
			<a th:href="@{/admin/trips}" th:attr="aria-current=${activeNav == 'trips'} ? 'page' : null">
				<i class="bi bi-list-ul" aria-hidden="true"></i>Chuyến
			</a>
		</div>
		<div class="grp">
			<span>Danh mục</span>
			<a th:href="@{/admin/stations}" th:attr="aria-current=${activeNav == 'stations'} ? 'page' : null">
				<i class="bi bi-bezier2" aria-hidden="true"></i>Ga và tuyến
			</a>
		</div>
		<div class="grp">
			<span>Bán vé</span>
			<a th:href="@{/admin/bookings}" th:attr="aria-current=${activeNav == 'bookings'} ? 'page' : null">
				<i class="bi bi-ticket-perforated" aria-hidden="true"></i>Booking
			</a>
			<a th:href="@{/admin/users}" th:attr="aria-current=${activeNav == 'users'} ? 'page' : null">
				<i class="bi bi-people" aria-hidden="true"></i>Người dùng
			</a>
		</div>
	</nav>

	<div class="admin-side-foot">
		<div class="admin-now" data-clock>
			<span data-clock-date></span>
			<b data-clock-time></b>
		</div>
		<!--
			Records removed from the screens above, kept apart from daily work
			next to sign-out. On a phone only the icon shows, like sign-out.
		-->
		<nav class="admin-side-extra" aria-label="Khác">
			<a th:href="@{/admin/history}" title="Lịch sử" aria-label="Lịch sử"
				th:attr="aria-current=${activeNav == 'history'} ? 'page' : null">
				<i class="bi bi-clock-history" aria-hidden="true"></i><span class="admin-history-label">Lịch sử</span>
			</a>
		</nav>
		<div class="admin-user">
			<span class="admin-avatar" aria-hidden="true" th:if="${currentUser != null}"
				th:text="${#strings.toUpperCase(#strings.substring(currentUser.fullName, currentUser.fullName.lastIndexOf(' ') + 1, currentUser.fullName.lastIndexOf(' ') + 2))}">A</span>
			<span class="admin-user-name" th:text="${currentUser?.fullName}"></span>
			<!-- Spring Security's logout only accepts POST, so this is a form. -->
			<form th:action="@{/logout}" method="post">
				<button type="submit" class="btn btn-link btn-sm admin-logout" title="Đăng xuất" aria-label="Đăng xuất">
					<i class="bi bi-box-arrow-right" aria-hidden="true"></i>
				</button>
			</form>
		</div>
	</div>
</aside>

</body>
</html>
