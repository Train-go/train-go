<!DOCTYPE html>
<!--
	Shared shell for the admin area. An admin page uses it like this:

		<html th:replace="~{admin/layout/base :: page(~{::title}, ~{::main})}">
		<head><title>...</title></head>
		<body><main> ... </main></body>
		</html>

	Same parameterised-fragment idiom as layout/base.html for the customer
	pages, so the repository has one way of building a page instead of two.

	Bootstrap is the same file the customer pages load; css/admin/admin.css
	themes it for the admin (docs/decisions/0012-giao-dien-admin-moi.md).
	Never link admin.css and css/app.css from the same page.
-->
<html lang="vi" xmlns:th="http://www.thymeleaf.org" th:fragment="page(title, content)">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
	<title th:replace="${title}">Quản trị TrainGo</title>
	<link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}">
	<!-- Read by TG.api, which sends the token on every request that changes data. -->
	<meta name="_csrf" th:content="${_csrf.token}">
	<meta name="_csrf_header" th:content="${_csrf.headerName}">

	<link rel="stylesheet" th:href="@{/vendor/bootstrap/bootstrap.min.css}">
	<link rel="stylesheet" th:href="@{/vendor/bootstrap-icons/bootstrap-icons.css}">
	<link rel="stylesheet" th:href="@{/css/admin/admin.css}">
</head>
<body>

<a class="visually-hidden-focusable position-absolute top-0 start-0 m-2 btn btn-primary" href="#main">Bỏ qua menu</a>

<div class="admin-shell">
	<aside th:replace="~{admin/fragments/sidebar :: sidebar}"></aside>

	<!--
		A div, not a <main>: every page brings its own <main>, and one <main>
		inside another is invalid. The skip link above lands here.
	-->
	<div id="main" class="admin-main" tabindex="-1">
		<div th:if="${errorMessage}" class="alert alert-danger" role="alert">
			<i class="bi bi-exclamation-triangle" aria-hidden="true"></i>
			<span th:text="${errorMessage}">Không xóa được ga.</span>
		</div>
		<!-- admin.js turns this into a toast and removes it. -->
		<div th:if="${successMessage}" hidden data-flash-success th:text="${successMessage}">Đã thêm ga.</div>

		<main th:replace="${content}"></main>
	</div>
</div>

<!-- Filled and opened by TG.confirm. -->
<div class="modal fade" id="tgConfirm" tabindex="-1" aria-labelledby="tgConfirmTitle" aria-describedby="tgConfirmBody" aria-hidden="true">
	<div class="modal-dialog modal-dialog-centered">
		<div class="modal-content modal-confirm">
			<h2 class="modal-title" id="tgConfirmTitle"></h2>
			<p class="modal-body-text text-body-secondary" id="tgConfirmBody"></p>
			<div class="modal-actions">
				<button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal" data-tg-back>Quay lại</button>
				<button type="button" class="btn btn-primary" data-tg-confirm>Đồng ý</button>
			</div>
		</div>
	</div>
</div>

<div class="toast-container position-fixed" id="tgToasts" aria-live="polite"></div>

<script th:src="@{/vendor/bootstrap/bootstrap.bundle.min.js}"></script>
<script th:src="@{/js/admin/admin.js}"></script>
</body>
</html>
