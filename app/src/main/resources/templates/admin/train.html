<!DOCTYPE html>
<!--
	The train page (docs/product/admin.md, "Quản lý tàu"): train tabs, the view
	switch, then one of two views, "Theo ngày" (fragments/train-day-view.html)
	or "Bảng tính" (fragments/train-sheet-view.html, ?view=bang). The tabs keep
	the view. The add and edit sheet saves through /api/admin/trains.
-->
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
	th:replace="~{admin/layout/base :: page(~{::title}, ~{::link}, ~{::main})}">
<head>
	<title th:text="${train != null} ? |Tàu ${train.code} · Quản trị TrainGo| : 'Tàu · Quản trị TrainGo'">Tàu · Quản trị TrainGo</title>
	<link rel="stylesheet" th:href="@{/css/admin/pages/train.css}">
</head>
<body>
<main class="admin-wrap">

	<div class="dc-head">
		<div>
			<h1>Tàu</h1>
			<p class="dc-date" th:text="${todayLabel}">Thứ Sáu, 30/10/2026</p>
		</div>
		<div class="tr-head-actions">
			<!-- train.js remembers the last choice, so the Tàu menu opens it again. -->
			<nav class="view-seg" aria-label="Cách xem lịch chạy" th:if="${train != null}" data-view-seg>
				<a th:href="@{/admin/trains/{id}(id=${train.id}, view='ngay')}" data-view="ngay"
					th:classappend="${view != 'bang'} ? 'active'"
					th:attr="aria-current=${view != 'bang'} ? 'page' : null">Theo ngày</a>
				<a th:href="@{/admin/trains/{id}(id=${train.id}, view='bang')}" data-view="bang"
					th:classappend="${view == 'bang'} ? 'active'"
					th:attr="aria-current=${view == 'bang'} ? 'page' : null">Bảng tính</a>
			</nav>
			<button type="button" class="btn btn-outline-secondary" data-train-add>
				<i class="bi bi-plus-lg" aria-hidden="true"></i>Thêm tàu
			</button>
		</div>
	</div>

	<nav class="tr-tabs" aria-label="Chọn tàu" th:if="${!#lists.isEmpty(trains)}">
		<a th:each="t : ${trains}" th:href="@{/admin/trains/{id}(id=${t.id}, view=${view == 'bang' ? 'bang' : 'ngay'})}"
			th:attr="aria-current=${train != null and t.id == train.id} ? 'page' : null">
			<b th:text="${t.code}">SE1</b><span th:text="${t.name}">Thống Nhất 1</span>
		</a>
	</nav>

	<div class="dc-card tr-empty" th:if="${train == null}">
		<b>Chưa có tàu nào.</b>
	</div>

	<!-- th:replace outranks th:if on one element, so the condition sits on a wrapper. -->
	<th:block th:if="${train != null and view != 'bang'}">
		<div th:replace="~{admin/fragments/train-day-view :: day}"></div>
	</th:block>
	<th:block th:if="${train != null and view == 'bang'}">
		<div th:replace="~{admin/fragments/train-sheet-view :: sheet}"></div>
	</th:block>

	<!-- One sheet for both actions; train.js fills it for "Thêm tàu" or "Sửa tàu". -->
	<div class="offcanvas offcanvas-end" tabindex="-1" id="train-sheet" aria-labelledby="train-sheet-title">
		<div class="offcanvas-header">
			<h2 class="offcanvas-title" id="train-sheet-title">Thêm tàu</h2>
			<button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Đóng"></button>
		</div>
		<form class="offcanvas-body" id="train-form" novalidate
			th:data-api-url="@{/api/admin/trains}" th:data-page-url="@{/admin/trains}">
			<div>
				<label class="form-label" for="train-code">Mã tàu</label>
				<input class="form-control mono" id="train-code" name="code" maxlength="10"
					autocomplete="off" autocapitalize="characters" spellcheck="false"
					aria-describedby="train-code-hint">
				<div class="form-text" id="train-code-hint">1-4 chữ cái rồi 1-4 chữ số, ví dụ SE4.</div>
			</div>
			<div>
				<label class="form-label" for="train-name">Tên tàu</label>
				<input class="form-control" id="train-name" name="name" maxlength="100" autocomplete="off">
			</div>
		</form>
		<div class="offcanvas-footer">
			<!-- Only for a train that may be deleted; train.js hides it while adding. -->
			<button type="button" class="btn btn-outline-danger" data-train-delete hidden th:if="${canDelete}">
				<i class="bi bi-trash3" aria-hidden="true"></i>Xóa tàu
			</button>
			<span class="grow"></span>
			<button type="button" class="btn btn-outline-secondary" data-bs-dismiss="offcanvas">Hủy</button>
			<button type="submit" class="btn btn-primary" form="train-form" data-train-submit>Thêm tàu</button>
		</div>
	</div>

	<th:block th:replace="~{admin/fragments/trip-sheet :: sheet}"></th:block>

	<!-- defer: runs after admin.js, which the layout loads at the end of the body. -->
	<script th:src="@{/js/admin/train.js}" defer></script>

</main>
</body>
</html>
