<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
	th:replace="~{admin/layout/base :: page(~{::title}, ~{::main})}">
<head>
	<title>Người dùng · Quản trị TrainGo</title>
</head>
<body>
<main>

	<!-- Read-only: docs/product/admin.md gives this screen no create, edit or delete. -->
	<div class="page-head">
		<h1>Người dùng</h1>
		<span class="count" th:text="|${#lists.size(users)} tài khoản|">12 tài khoản</span>
	</div>

	<div class="panel table-responsive">
		<table class="table table-hover align-middle">
			<thead>
				<tr>
					<th scope="col">Họ tên</th>
					<th scope="col">Email</th>
					<th scope="col">Vai trò</th>
					<th scope="col">Ngày tạo</th>
				</tr>
			</thead>
			<tbody>
				<tr th:each="user : ${users}">
					<td class="fw-bold" th:text="${user.name}">Nguyễn Văn An</td>
					<td th:text="${user.email}">an.nguyen@example.com</td>
					<td>
						<span class="tag plain" th:text="${user.role} == 'ADMIN' ? 'Quản trị' : 'Khách hàng'">Khách hàng</span>
					</td>
					<td class="text-nowrap" th:text="${user.createdAt}">12/08/2026</td>
				</tr>
			</tbody>
		</table>
	</div>

</main>
</body>
</html>
