<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
	th:replace="~{admin/layout/base :: page(~{::title}, ~{::main})}">
<head>
	<title>Tàu · Quản trị TrainGo</title>
</head>
<body>
<main>

	<div class="page-head">
		<h1>Tàu</h1>
		<span class="count" th:text="|${#lists.size(trains)} tàu|">3 tàu</span>
	</div>

	<div class="panel table-responsive">
		<table class="table table-hover align-middle">
			<thead>
				<tr>
					<th scope="col" class="shrink">Mã tàu</th>
					<th scope="col">Tên tàu</th>
				</tr>
			</thead>
			<tbody>
				<tr th:each="train : ${trains}">
					<td><span class="code" th:text="${train.code}">SE1</span></td>
					<td th:text="${train.name}">Thống Nhất</td>
				</tr>
			</tbody>
		</table>
	</div>

</main>
</body>
</html>
