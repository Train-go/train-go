<!DOCTYPE html>
<!--
	A failed attempt comes back as /login?error; its email returns once as
	loginEmail, the password never does.
-->
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
	th:replace="~{layout/base :: page(title=~{::title}, content=~{::main}, compactFooter=true)}">
<head>
	<title>Đăng nhập · TrainGo</title>
</head>
<body>
<main class="container py-4 py-md-5">
	<div class="row justify-content-center">
		<div class="col-12 col-sm-10 col-md-7 col-lg-5">
			<div class="card">
				<div class="card-body p-4">
					<h1 class="h3 mb-4">Đăng nhập</h1>

					<div class="alert alert-success" role="status" th:if="${accountCreatedMessage != null}"
						th:text="${accountCreatedMessage}"></div>
					<div class="alert alert-danger" role="alert" id="login-error" th:if="${loginFailed}">
						Email hoặc mật khẩu không đúng.
					</div>

					<form th:action="@{/login}" method="post">
						<div class="mb-3">
							<label for="email" class="form-label">Email</label>
							<input type="email" class="form-control" id="email" name="email" required
								autocomplete="username" th:value="${loginEmail}"
								th:attr="aria-describedby=${loginFailed} ? 'login-error' : null">
						</div>

						<div class="mb-4">
							<label for="password" class="form-label">Mật khẩu</label>
							<div class="input-group">
								<input type="password" class="form-control" id="password" name="password" required
									autocomplete="current-password"
									th:attr="aria-describedby=${loginFailed} ? 'login-error' : null">
								<button type="button" class="btn btn-outline-secondary d-none" data-password-toggle="password"
									aria-controls="password" aria-pressed="false" aria-label="Hiện mật khẩu">
									<i class="bi bi-eye" aria-hidden="true"></i>
								</button>
							</div>
						</div>

						<button type="submit" class="btn btn-primary w-100">Đăng nhập</button>
					</form>

					<p class="text-center mt-4 mb-0">
						Chưa có tài khoản? <a th:href="@{/register}">Đăng ký</a>
					</p>
				</div>
			</div>
		</div>
	</div>
	<script th:src="@{/js/auth.js}" defer></script>
</main>
</body>
</html>
