<!DOCTYPE html>
<!--
	A failed attempt comes back as /login?error; its email returns once as
	loginEmail, the password never does.
-->
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
	th:replace="~{layout/base :: page(title=~{::title}, styles=~{::link}, content=~{::main}, compactFooter=true)}">
<head>
	<title>Đăng nhập · TrainGo</title>
	<link rel="stylesheet" th:href="@{/css/pages/auth.css}">
</head>
<body>
<main class="auth">
	<div class="auth-main">
		<div class="auth-card">
			<h1>Đăng nhập</h1>

			<form class="auth-form" th:action="@{/login}" method="post">
				<div class="alert alert-success" role="status" th:if="${accountCreatedMessage != null}" th:text="${accountCreatedMessage}"></div>
				<div class="alert alert-danger" role="alert" id="login-error" th:if="${loginFailed}">Email hoặc mật khẩu không đúng.</div>

				<div class="field">
					<label class="field-label" for="email">Email</label>
					<div class="control">
						<i class="bi bi-envelope" aria-hidden="true"></i>
						<input id="email" name="email" type="email" required autocomplete="username" inputmode="email" maxlength="255" placeholder="ban@example.com"
							th:value="${loginEmail}" th:attr="aria-describedby=${loginFailed} ? 'login-error' : null">
					</div>
				</div>

				<div class="field">
					<label class="field-label" for="password">Mật khẩu</label>
					<div class="control">
						<i class="bi bi-lock" aria-hidden="true"></i>
						<input id="password" name="password" type="password" required autocomplete="current-password"
							th:attr="aria-describedby=${loginFailed} ? 'login-error' : null">
						<button class="reveal d-none" type="button" data-password-toggle="password" aria-controls="password" aria-pressed="false" aria-label="Hiện mật khẩu"><i class="bi bi-eye" aria-hidden="true"></i></button>
					</div>
				</div>

				<button class="btn btn-cta btn-block" type="submit">Đăng nhập</button>
			</form>

			<p class="auth-foot">Chưa có tài khoản? <a th:href="@{/register}">Đăng ký</a></p>
		</div>
	</div>

	<aside class="auth-visual" aria-hidden="true">
		<img th:src="@{/images/home/ga-da-nang.jpg}" width="960" height="720" alt="">
		<div class="auth-glass">
			<h2>Chào mừng bạn trở lại!</h2>
			<p>Đăng nhập để tiếp tục hành trình, quản lý vé đã đặt và khám phá những chuyến đi tiếp theo.</p>
		</div>
	</aside>
	<script th:src="@{/js/auth.js}" defer></script>
</main>
</body>
</html>
