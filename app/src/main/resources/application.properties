spring.application.name=traingo

# Port 8080 is taken by a local Apache (XAMPP) install, so the embedded
# Tomcat listens on 8081 instead.
server.port=8081

# Local development database. Start it with: docker compose up -d
spring.datasource.url=jdbc:mysql://localhost:3306/traingo?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh
spring.datasource.username=traingo
spring.datasource.password=traingo

# Flyway creates the tables and the demo data from src/main/resources/db/migration
# on startup. Hibernate never changes the schema; it only checks that every
# entity still matches a table, so a mismatch stops the application at boot
# instead of failing later on some page.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# Templates are re-read on every request so edits show up without a restart.
spring.thymeleaf.cache=false

# Temporary development login. There is no user store yet, so without this
# Spring Boot invents a user named "user" and prints a new random password on
# every restart -- unusable for a demo. Delete these three lines when the auth
# feature lands and the admin account comes from seed data instead.
spring.security.user.name=admin
spring.security.user.password=admin
spring.security.user.roles=ADMIN
