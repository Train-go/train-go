spring.application.name=traingo

# Port 8080 is taken by a local Apache (XAMPP) install, so the embedded
# Tomcat listens on 8081 instead.
server.port=8081

# Local development database. Start it with: docker compose up -d
spring.datasource.url=jdbc:mysql://localhost:3306/traingo?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh
spring.datasource.username=traingo
spring.datasource.password=traingo

# Hibernate creates and updates tables from the entities during development.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# Templates are re-read on every request so edits show up without a restart.
spring.thymeleaf.cache=false
