spring.application.name=traingo

server.port=8080

# Sessions travel in the JSESSIONID cookie only, never in the URL. Without
# this, the first page of a new visit that is an error page (404, 403, 500)
# gets ";jsessionid=..." appended to its stylesheet links, Spring Security's
# firewall rejects those URLs with 400, and the error page shows unstyled.
server.servlet.session.tracking-modes=cookie

# Local development database: Windows MySQL Server (MySQL80).
spring.datasource.url=jdbc:mysql://localhost:3306/traingo?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh
spring.datasource.username=traingo
spring.datasource.password=traingo

# Flyway creates the tables and the demo data from src/main/resources/db/migration
# on startup. Hibernate never changes the schema; it only checks that every
# entity still matches a table, so a mismatch stops the application at boot
# instead of failing later on some page.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# Templates are re-read on every request so edits show up without a restart.
spring.thymeleaf.cache=false
